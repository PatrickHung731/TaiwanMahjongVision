name: Build APK

# 為什麼用 GitHub Actions 編譯：
# 開發機沒有 JDK / Android SDK / Gradle，本機產不出 .apk。
# 推上來之後這個 workflow 會在雲端編譯，完成後在 Actions 頁面下載 APK 直接裝。

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:        # 也可以在 Actions 頁面手動按 Run

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 安裝 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 準備 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安裝 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 引擎的單元測試。演算法錯了就不該產出 APK。
      - name: 跑演算法測試
        run: gradle :core-engine:test --no-daemon --stacktrace

      - name: 編譯 debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 上傳 APK
        uses: actions/upload-artifact@v4
        with:
          name: TaiwanMahjongVision-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 測試失敗時，把報告一起帶出來比較好查
      - name: 上傳測試報告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core-engine/build/reports/tests/
          retention-days: 7
